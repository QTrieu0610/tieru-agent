name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint (ruff)
        run: python -m ruff check tieru evals scripts
      - name: Compile
        run: python -m compileall -q tieru
      - name: Validate skills (community PRs land here)
        run: python scripts/validate_skills.py
      - name: Deterministic evals (offline tier — no API key in CI)
        run: python -m pytest -q evals/deterministic

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install dist/*.whl
          wheel-venv/bin/tieru --help
      - name: Verify packaged runtime data
        run: |
          wheel-venv/bin/python -c "from importlib.resources import files; root=files('tieru'); assert root.joinpath('tieru.example.yaml').is_file(); assert root.joinpath('ops').joinpath('static').joinpath('index.html').is_file()"
