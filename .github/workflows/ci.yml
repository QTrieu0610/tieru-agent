name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install contributor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and import
        run: |
          python -m compileall -q tieru
          python -c "import tieru"
      - name: Run deterministic suite (live integrations skip honestly)
        env:
          TIERU_HOME: ${{ runner.temp }}/tieru-ci
        run: python -m pytest -q evals/deterministic
      - name: Smoke CLI parsers
        run: |
          tieru --help
          tieru init --help
          tieru doctor --help
          tieru replay --help
          tieru fabric --help
          tieru shadow --help
          tieru capsule --help

  quality:
    name: Quality and release checks / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d0b959f7b4775c0b98b0e1d0b0b # v4
        with:
          node-version: "20"
      - name: Install contributor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: python -m ruff check tieru evals scripts
      - name: Validate bundled skills
        run: python scripts/validate_skills.py
      - name: Check dashboard JavaScript syntax
        run: |
          node --check tieru/ops/static/js/main.js
          node --check tieru/ops/static/js/util.js
          node --check tieru/ops/static/js/views.js
      - name: Run release gate (tests, build, metadata, and artifact audit)
        env:
          TIERU_HOME: ${{ runner.temp }}/tieru-ci
        run: python -m tieru.ops.release_gate
